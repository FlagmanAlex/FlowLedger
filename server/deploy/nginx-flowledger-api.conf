# Фрагмент для server { ... } того же домена, где отдаётся клиент (/flowledger/).
# Префикс /flowledger/api/ длиннее, чем /flowledger/, — nginx выберет этот location
# для API, а SPA-фоллбэк клиента его не перехватит.
location /flowledger/api/ {
    proxy_pass http://127.0.0.1:3100/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
}
